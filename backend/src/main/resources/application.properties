spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---------- MySQL Database Configuration ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillsphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=2


# ---------- JPA / Hibernate ----------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Replace with a long, random secret in production (>= 256 bits for HS256)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---------- Google Sign-In ----------
# The OAuth Client ID from Google Cloud Console (Credentials -> OAuth 2.0 Client IDs).
# Must match the client ID used on the frontend (see frontend/.env).
google.client-id=863730013400-717u45eqg4eqbcbufrn99js7lqg9im7c.apps.googleusercontent.com


# ---------- Error Handling ----------
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- Gemini AI Chatbot ----------
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# ---------- Mail Configuration ----------
# Dummy properties. To actually send emails, replace with a real SMTP server (e.g. Gmail, SendGrid)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gmsids01@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true